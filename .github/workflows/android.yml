name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Publish APK to stamp folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk stamp/cafejigi-stamp.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stamp/cafejigi-stamp.apk
          git commit -m "Android 앱 빌드 #${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main

      - name: Save build log on failure
        if: failure()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no build log" > /tmp/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan android-build-log
          git rm -rf -q --cached .
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log #${{ github.run_number }}"
          git push -f origin android-build-log
